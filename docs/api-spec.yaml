# ─────────────────────────────────────
# Phase 2 — 건강검진
# ─────────────────────────────────────

  /health-reports:
    post:
      tags: [HealthReports]
      summary: 건강검진 파일 업로드
      description: |
        허용 MIME: `application/pdf`, `image/jpeg`, `image/png`. 최대 10MB.
        multipart/form-data 필드: `file`(파일), `title`(필수), `reportDate`(선택, YYYY-MM-DD),
        `notes`(선택), `extractedAllergenIds`(선택, JSON 배열 문자열).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                reportDate:
                  type: string
                  format: date
                notes:
                  type: string
                extractedAllergenIds:
                  type: string
                  description: JSON 배열 문자열 (예 ["ing-milk"])
      responses:
        '201':
          description: 업로드된 건강검진 메타
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [HealthReports]
      summary: 건강검진 목록
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: 건강검진 목록 + 페이지 정보
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/HealthReport'
                  total:
                    type: integer
                  hasMore:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health-reports/{id}:
    get:
      tags: [HealthReports]
      summary: 건강검진 상세 + signed URL (TTL 5분)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 건강검진 상세 + 다운로드 URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/HealthReport'
                  - type: object
                    properties:
                      downloadUrl:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않거나 소유자 불일치
    patch:
      tags: [HealthReports]
      summary: 건강검진 메타 수정
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                reportDate:
                  type: string
                  format: date
                notes:
                  type: string
                extractedAllergenIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: 수정된 건강검진 메타
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않거나 소유자 불일치
    delete:
      tags: [HealthReports]
      summary: 건강검진 삭제 (Storage + row)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않거나 소유자 불일치

  # ─────────────────────────────────────
  # 클로즈드 베타 (v3 — closed-beta.md)
  # ─────────────────────────────────────

  /waitlist:
    post:
      tags: [Beta]
      summary: 베타 waitlist 등록 (공개)
      description: |
        클로즈드 베타 진입 funnel 의 시작점. 인증 불필요.
        IP 당 분당 5건 rate limit. 동일 email 재요청은 멱등 (200 alreadyRegistered).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, cohort]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: jane@example.com
                cohort:
                  type: array
                  items:
                    type: string
                    enum: [us-allergy, us-ka, us-veg]
                  minItems: 1
                  example: [us-allergy, us-veg]
                source:
                  type: string
                  maxLength: 64
                  example: reddit-r-foodallergies
                locale:
                  type: string
                  enum: [en, ko, ja, zh, es, fr]
                  default: en
      responses:
        '201':
          description: 신규 등록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '200':
          description: 이미 등록된 email
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  alreadyRegistered: { type: boolean, example: true }
        '400':
          description: 잘못된 입력 (email 형식 / cohort enum / locale enum)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Rate limit 초과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: DB 일시 미가용
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/redeem-invite:
    post:
      tags: [Beta]
      summary: 베타 invite_code 사용
      description: |
        social login 후 첫 진입 시 호출. waitlist.invite_code 매칭 →
        profiles.beta_cohort 채움. 멱등 (이미 redeem 한 사용자는 200 alreadyRedeemed).
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode:
                  type: string
                  minLength: 6
                  maxLength: 64
                  example: 7f3a9b2c1d
      responses:
        '200':
          description: redeem 성공 또는 이미 redeem
          content:
            application/json:
              schema:
                type: object
                required: [ok, cohort]
                properties:
                  ok: { type: boolean }
                  cohort:
                    type: array
                    items:
                      type: string
                      enum: [us-allergy, us-ka, us-veg]
                  alreadyRedeemed: { type: boolean }
        '400':
          description: invite code 형식 오류 (6자 미만 / 64자 초과)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 유효하지 않은 invite code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: INVALID_INVITE_CODE
                message: Invalid invite code.

  /auth/accept-terms:
    post:
      tags: [Auth]
      summary: 약관 동의 audit trail 기록
      description: |
        사용자가 *현재 버전* 약관에 동의했음을 기록. profiles.terms_accepted_at + terms_version 채움.
        FE 가 가입 직후 또는 약관 변경 감지 시 fire-and-forget 호출. 멱등 — 같은 사용자가 다시 호출하면 timestamp 만 갱신.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: 동의한 약관 버전 (날짜 형식 권장).
                  example: '2026-05-07'
      responses:
        '200':
          description: 기록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  termsAcceptedAt: { type: string, format: date-time }
                  termsVersion: { type: string }
        '400':
          description: version 누락 또는 64자 초과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: DB 일시 사용 불가

  /scan-logs/{scanLogId}/feedback:
    post:
      tags: [Beta]
      summary: 1탭 피드백 (helpful 기록)
      description: |
        ScanResult 화면에서 사용자가 👍/👎 선택 시 호출. 본인 scan_log row 만 수정 가능.
        멱등 (덮어쓰기 허용). 응답에 comment echo 안 함 (XSS 방어).
      security: [{ BearerAuth: [] }]
      parameters:
        - name: scanLogId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [helpful]
              properties:
                helpful: { type: boolean, example: true }
                comment:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: 피드백 저장 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '400':
          description: helpful 누락 또는 comment 길이 초과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 본인 scan_log 가 없거나 미존재

  # ─────────────────────────────────────
  # 커뮤니티 (리뷰 / 좋아요 / Q&A 게시판)
  # ─────────────────────────────────────
  # 구현 메모 (전 엔드포인트 공통):
  # (informative: 규범 정의는 docs/tasks/community/01-foundation.md §F1)
  #   - 신규 마이그레이션 db/migrations/0008_community.sql 필요:
  #       product_reviews(id uuid pk default gen_random_uuid(),
  #         product_id text not null references products(id) on delete cascade,
  #         user_id uuid not null references auth.users(id) on delete cascade,
  #         rating int not null check (rating between 1 and 5),
  #         content text not null check (char_length(btrim(content)) between 1 and 500),
  #         created_at timestamptz not null default now(),
  #         updated_at timestamptz not null default now(),
  #         unique (product_id, user_id))
  #       product_likes(product_id text not null references products(id) on delete cascade,
  #         user_id uuid not null references auth.users(id) on delete cascade,
  #         created_at timestamptz not null default now(),
  #         primary key (product_id, user_id))
  #       qna_posts(id uuid pk, user_id uuid not null references auth.users(id)
  #         on delete cascade, title text not null check (char_length(btrim(title)) between 1 and 100),
  #         content text not null check (char_length(btrim(content)) between 1 and 2000),
  #         related_product_id text references products(id) on delete set null,
  #         is_resolved boolean not null default false,
  #         created_at/updated_at timestamptz default now())
  #       qna_answers(id uuid pk, qna_id uuid not null references qna_posts(id)
  #         on delete cascade, user_id uuid not null references auth.users(id)
  #         on delete cascade, content text not null check (char_length(btrim(content)) between 1 and 1000),
  #         is_accepted boolean not null default false,
  #         created_at/updated_at timestamptz default now())
  #     RLS enable + service-role 쓰기, 사용자 select 정책은 기존 테이블과 동일 패턴.
  #     인덱스(요약 — 규범은 §F1): product_reviews(product_id, created_at desc),
  #     qna_posts(created_at desc, answer_count desc), qna_answers(qna_id, created_at),
  #     product_likes(user_id, product_id). 카운터 트리거: product_likes INSERT/DELETE →
  #     products.like_count ±1, qna_answers INSERT/DELETE → qna_posts.answer_count ±1.
  #   - products.id 는 text(prod-* / off-* / ocr-*)이므로 product 경로 파라미터·
  #     productId 는 string (uuid 아님). review/qna/answer id 는 uuid.
  #   - 인증: 전 엔드포인트 verifyToken 필수 (Notion 의 "비로그인 조회 가능"은
  #     전역 BearerAuth 보안 모델·기존 모든 데이터 엔드포인트와의 정합성을 위해
  #     인증 필수로 통일). isMine/isLiked 는 request.userId 로 산출.
  #   - userNickname 은 profiles.display_name(커뮤니티 전용 표시명) 조인. 미설정/NULL 시 '익명'.
  #   - 페이지네이션은 limit/offset + {..., total, hasMore} (search/scan-history와
  #     동일 규약. Notion 의 page/totalPages 는 폐기). total 은 Supabase
  #     count:'exact', hasMore = offset + 반환수 < total.
  #   - 에러 매핑은 favorites/profiles-members 와 동일: PostgREST 23505(unique)→409,
  #     23503(FK)→404, 소유권은 행 조회 후 user_id 비교(불일치 403 / 부재 404).
  #     삭제 성공은 기존 delete 관례대로 200 + {message} (Notion 의 204 폐기).

  /products/{id}/reviews:
    get:
      tags: [Community]
      summary: 상품 리뷰 목록 조회
      description: |
        특정 상품의 리뷰를 정렬·페이지네이션해 반환합니다.
        product_reviews 를 product_id 로 조회하고 profiles.display_name(커뮤니티 전용 표시명) 을 조인해
        userNickname 을 채웁니다. isMine 은 row.user_id === request.userId.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: 상품 ID (products.id)
          example: prod-001
        - in: query
          name: sort
          schema:
            type: string
            enum: [latest, oldest]
            default: latest
          description: 정렬 기준
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          description: 한 번에 반환할 최대 항목 수
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: 건너뛸 항목 수 (페이지네이션)
      responses:
        '200':
          description: 리뷰 목록 반환
          content:
            application/json:
              schema:
                type: object
                required: [reviews, total, hasMore]
                properties:
                  reviews:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }
                  total:
                    type: integer
                    description: 필터 적용 기준 전체 리뷰 수 (count exact)
                    example: 45
                  hasMore:
                    type: boolean
                    description: 다음 페이지 존재 여부
        '400':
          description: 쿼리 파라미터 검증 실패
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: INVALID_QUERY, message: 요청 파라미터가 올바르지 않습니다. }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않는 상품 ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: PRODUCT_NOT_FOUND, message: 해당 제품을 찾을 수 없습니다. }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      tags: [Community]
      summary: 상품 리뷰 작성
      description: |
        특정 상품에 리뷰를 작성합니다. (product_id, user_id) unique 제약으로
        사용자당 상품 1개 리뷰만 허용 — 중복 시 PostgREST 23505 → 409.
        존재하지 않는 product_id 는 FK 23503 → 404.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          example: prod-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, content]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 4
                content:
                  type: string
                  maxLength: 500
                  example: "Those with a flour allergy, please exercise caution."
      responses:
        '201':
          description: 리뷰 작성 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않는 상품 ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: PRODUCT_NOT_FOUND, message: 해당 제품을 찾을 수 없습니다. }
        '409':
          description: 해당 상품에 이미 리뷰를 작성함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: ALREADY_REVIEWED, message: 이미 리뷰를 작성한 제품입니다. }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /reviews/{id}:
    patch:
      tags: [Community]
      summary: 상품 리뷰 수정
      description: |
        본인이 작성한 리뷰를 부분 수정합니다. 요청 바디에 포함된 필드만 갱신.
        소유권: row 조회 후 user_id !== request.userId → 403 FORBIDDEN_REVIEW,
        부재 → 404 REVIEW_NOT_FOUND (profiles-members PATCH 와 동일 패턴).
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: 리뷰 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
                content: { type: string, maxLength: 500 }
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 본인이 작성한 리뷰가 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: FORBIDDEN_REVIEW, message: 본인이 작성한 리뷰만 수정할 수 있습니다. }
        '404':
          description: 존재하지 않는 리뷰 ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: REVIEW_NOT_FOUND, message: 리뷰를 찾을 수 없습니다. }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags: [Community]
      summary: 상품 리뷰 삭제
      description: |
        본인이 작성한 리뷰를 삭제합니다. 기존 delete 관례에 따라 200 + {message}
        (Notion 의 204 No Content 는 favorites/scan-history/profiles 와의 정합성을
        위해 폐기).
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: 리뷰 ID
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: 리뷰가 삭제되었습니다. }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 본인이 작성한 리뷰가 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: FORBIDDEN_REVIEW, message: 본인이 작성한 리뷰만 삭제할 수 있습니다. }
        '404':
          description: 존재하지 않는 리뷰 ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: REVIEW_NOT_FOUND, message: 리뷰를 찾을 수 없습니다. }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /products/{id}/likes:
    post:
      tags: [Community]
      summary: 상품 좋아요
      description: |
        상품에 좋아요를 추가합니다. product_likes 의 PK (product_id, user_id) 가
        중복을 원자적으로 차단 — 23505 → 409 ALREADY_LIKED. FK 23503 → 404.
        likeCount 는 products.like_count(트리거 비정규화 값) 조회.
        이 데이터가 GET /community/feed 의 similarUsersPicks 기반.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          example: prod-001
      responses:
        '201':
          description: 좋아요 추가 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않는 상품 ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: PRODUCT_NOT_FOUND, message: 해당 제품을 찾을 수 없습니다. }
        '409':
          description: 이미 좋아요를 누른 상품
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: ALREADY_LIKED, message: 이미 좋아요를 누른 제품입니다. }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags: [Community]
      summary: 상품 좋아요 취소
      description: |
        좋아요를 취소합니다. delete ... eq(product_id).eq(user_id) 결과가 없으면
        404 LIKE_NOT_FOUND. 상태 반영을 위해 200 + LikeState 반환 (단순 토글이라
        {message} 대신 갱신된 likeCount/isLiked 를 돌려줌).
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          example: prod-001
      responses:
        '200':
          description: 좋아요 취소 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 좋아요 기록 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: LIKE_NOT_FOUND, message: 좋아요 기록을 찾을 수 없습니다. }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /qna:
    get:
      tags: [Community]
      summary: Q&A 게시판 목록 조회
      description: |
        Q&A 게시글을 검색·정렬·페이지네이션해 반환합니다. answerCount 는
        qna_posts.answer_count(트리거 비정규화 값) 조회. search 는 title/content ILIKE.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: sort
          schema:
            type: string
            enum: [latest, oldest, mostAnswered]
            default: latest
          description: 정렬 기준
        - in: query
          name: search
          schema: { type: string }
          description: 제목·내용 검색어 (ILIKE 부분 일치)
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Q&A 목록 반환
          content:
            application/json:
              schema:
                type: object
                required: [posts, total, hasMore]
                properties:
                  posts:
                    type: array
                    items: { $ref: '#/components/schemas/QnaPostSummary' }
                  total: { type: integer, example: 198 }
                  hasMore: { type: boolean }
        '400':
          description: 쿼리 파라미터 검증 실패
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: INVALID_QUERY, message: 요청 파라미터가 올바르지 않습니다. }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      tags: [Community]
      summary: Q&A 게시글 등록
      description: |
        알레르기 관련 질문을 등록합니다. relatedProductId 제공 시 FK 검증
        (없는 상품이면 23503 → 404 PRODUCT_NOT_FOUND).
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title:
                  type: string
                  maxLength: 100
                  example: 땅콩 알레르기인데 이 과자 먹어도 될까요?
                content:
                  type: string
                  maxLength: 2000
                  example: 성분표에 땅콩 가공시설 사용이라고 나와있는데 먹어도 괜찮은지 궁금합니다.
                relatedProductId:
                  type: string
                  nullable: true
                  description: 관련 상품 ID (products.id). 선택.
                  example: prod-001
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QnaPostSummary' }
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않는 relatedProductId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: PRODUCT_NOT_FOUND, message: 해당 제품을 찾을 수 없습니다. }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /qna/{id}:
    get:
      tags: [Community]
      summary: Q&A 게시글 상세조회
      description: |
        게시글 상세 + 답변 목록(작성순) + relatedProduct(있으면 products 조인)을
        함께 반환합니다.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: Q&A 게시글 ID
      responses:
        '200':
          description: 상세 반환
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QnaPostDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않는 Q&A ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: QNA_NOT_FOUND, message: 게시글을 찾을 수 없습니다. }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    patch:
      tags: [Community]
      summary: Q&A 게시글 수정
      description: |
        본인이 작성한 게시글을 부분 수정합니다. isResolved 를 true 로 변경해
        해결 표시할 수 있습니다. 소유권 불일치 403 FORBIDDEN_QNA / 부재 404.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 100 }
                content: { type: string, maxLength: 2000 }
                isResolved: { type: boolean }
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QnaPostSummary' }
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 본인이 작성한 게시글이 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: FORBIDDEN_QNA, message: 본인이 작성한 게시글만 수정할 수 있습니다. }
        '404':
          description: 존재하지 않는 Q&A ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: QNA_NOT_FOUND, message: 게시글을 찾을 수 없습니다. }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags: [Community]
      summary: Q&A 게시글 삭제
      description: |
        본인이 작성한 게시글을 삭제합니다. qna_answers 는 FK ON DELETE CASCADE 로
        함께 삭제. 200 + {message} (delete 관례).
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: 게시글이 삭제되었습니다. }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 본인이 작성한 게시글이 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: FORBIDDEN_QNA, message: 본인이 작성한 게시글만 삭제할 수 있습니다. }
        '404':
          description: 존재하지 않는 Q&A ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: QNA_NOT_FOUND, message: 게시글을 찾을 수 없습니다. }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /qna/{id}/answers:
