      responses:
        '201':
          description: 답변 등록 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QnaAnswer' }
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않는 Q&A ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: QNA_NOT_FOUND, message: 게시글을 찾을 수 없습니다. }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /answers/{id}:
    patch:
      tags: [Community]
      summary: Q&A 게시글 답변 수정
      description: |
        본인이 작성한 답변을 수정합니다. 소유권 불일치 403 FORBIDDEN_ANSWER /
        부재 404 ANSWER_NOT_FOUND.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: 답변 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QnaAnswer' }
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 본인이 작성한 답변이 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: FORBIDDEN_ANSWER, message: 본인이 작성한 답변만 수정할 수 있습니다. }
        '404':
          description: 존재하지 않는 답변 ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: ANSWER_NOT_FOUND, message: 답변을 찾을 수 없습니다. }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags: [Community]
      summary: Q&A 게시글 답변 삭제
      description: |
        본인이 작성한 답변을 삭제합니다. 200 + {message} (delete 관례).
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: 답변 ID
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: 답변이 삭제되었습니다. }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 본인이 작성한 답변이 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: FORBIDDEN_ANSWER, message: 본인이 작성한 답변만 삭제할 수 있습니다. }
        '404':
          description: 존재하지 않는 답변 ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: ANSWER_NOT_FOUND, message: 답변을 찾을 수 없습니다. }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /community/feed:
    get:
      tags: [Community]
      summary: 커뮤니티 피드 (주간 인기 + 유사 사용자 추천)
      description: |
        커뮤니티 홈 진입 시 호출. 두 개의 고정 큐레이션 리스트를 반환합니다
        (페이지네이션 없음 — Notion 의 pagination 객체는 폐기).
          - weeklyTrending: 최근 7일 scan_history 를 product_id 로 집계해
            스캔 수 상위 N개. scanCount 채움.
          - similarUsersPicks: 현재 활성 프로필의 allergy_profile 과 겹치는
            사용자들이 product_likes 한 상품 중, 본인이 아직 좋아요하지 않은
            상품을 like 수 기준 상위 N개. scanCount 는 null.
        isSafe/riskLevel 은 resolveActiveProfile + computeVerdict 로 서버 산출
        (favorites/scan-history 와 동일 로직).
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          description: 각 리스트별 최대 항목 수
      responses:
        '200':
          description: 피드 반환
          content:
            application/json:
              schema:
                type: object
                required: [weeklyTrending, similarUsersPicks]
                properties:
                  weeklyTrending:
                    type: array
                    items: { $ref: '#/components/schemas/CommunityFeedItem' }
                  similarUsersPicks:
                    type: array
                    items: { $ref: '#/components/schemas/CommunityFeedItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

# ─────────────────────────────────────
# 공통 스키마 및 응답
# ─────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token
    AdminToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        ADMIN_TOKEN 환경변수에 설정된 고정 토큰. /admin/* 경로 보호용.
        Supabase JWT 와 별개의 자격증명 — 운영자에게만 1Password 등으로 공유.

  schemas:

    DietaryRestriction:
      type: string
      enum:
        - vegan
        - fruitarian
        - lacto_vegetarian
        - ovo_vegetarian
        - lacto_ovo_vegetarian
        - pesco_vegetarian
        - pollo_vegetarian
        - flexitarian
      description: |
        식이(채식) 타입. profiles.dietary_restrictions 배열에 이 enum 값 + 선택적
        vegan modifier (strict / flexible) 가 함께 저장된다. SSOT: GET /diets/catalog.

    UserProfile:
      type: object
      properties:
        id:
          type: string
          example: uuid-1234
        email:
          type: string
          example: user@example.com
        name:
          type: string
          example: 홍길동
        displayName:
          type: string
          nullable: true
          description: '커뮤니티 전용 표시명(profiles.display_name). 미설정/NULL 시 null → 커뮤니티에서 ''익명'' 표시.'
        allergyProfile:
          type: array
          items:
            type: string
          example: [ing-peanut]
        dietaryRestrictions:
          type: array
          items:
            type: string
          example: [vegan]
        sensitivityLevel:
          type: string
          enum: [strict, normal]
          example: normal
        language:
          type: string
          example: ko
        consentFlags:
          type: object
          properties:
            imageRetention:
              type: boolean
              default: false
            corrections:
              type: boolean
              default: false
        hasCompletedSurvey:
          type: boolean
          example: true
        betaCohort:
          type: array
          nullable: true
          items:
            type: string
            enum: [us-allergy, us-ka, us-veg]
          minItems: 1
          description: 베타 코호트 배열. null = 미통과 또는 일반 사용자. 0005 마이그레이션으로 단일 → 배열.
          example: [us-allergy, us-veg]
        termsAcceptedAt:
          type: string
          format: date-time
          nullable: true
          description: 약관 동의 시각 (ISO8601). null = 미동의 또는 legacy. 0007 마이그레이션.
          example: '2026-05-08T10:00:00.000Z'
        termsVersion:
          type: string
          nullable: true
          description: 동의한 약관 버전. 현재 버전과 다르면 FE 가 재동의 호출.
          example: '2026-05-07'

    Product:
      type: object
      properties:
        id:
          type: string
          example: prod-001
        barcode:
          type: string
          nullable: true
          example: '0034000020430'
        name:
          type: string
          example: Reese's Peanut Butter Cups
        brand:
          type: string
          example: Hershey's
        image:
          type: string
          format: uri
          example: https://images.openfoodfacts.org/...
        phash:
          type: string
          nullable: true
          description: 64-bit perceptual hash (OCR 업서트 시 설정)
          example: 'c3f1a0b8d4e60927'
        source:
          type: string
          enum: [seed, off, ocr]
          description: 레코드 출처
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientSummary'
        dataCompleteness:
          type: string
          enum: [complete, partial]

    ProductSummary:
      type: object
      description: 목록 표시용 제품 요약 (ingredients 미포함)
      properties:
        id:
          type: string
          example: prod-001
        name:
          type: string
          example: Reese's Peanut Butter Cups
        brand:
          type: string
          example: Hershey's
        image:
          type: string
          format: uri
        isSafe:
          type: boolean
          description: 현재 사용자 프로필 기준 안전 여부
          example: false

    Ingredient:
      type: object
      properties:
        id:
          type: string
          example: ing-peanut
        name:
          type: string
          example: Peanuts
        nameKo:
          type: string
          example: 땅콩
        description:
          oneOf:
            - type: string
              description: 단일 언어 legacy shape (한국어). 마이그 잔존 행 또는 미정의 ingredient 에 한정.
            - type: object
              additionalProperties:
                type: string
              description: |
                BCP47 언어 코드 → 설명 텍스트 dict. 다국어 카탈로그 마이그(0007) 후 표준.
                키 예시: en, ko, ja, zh, es, fr.
          example:
            en: Peanuts cause some of the most severe allergic reactions, with even trace amounts potentially triggering fatal anaphylaxis.
            ko: 땅콩은 가장 심각한 알러지 반응을 유발하는 식품 중 하나로, 소량으로도 치명적인 아나필락시스를 일으킬 수 있습니다.
            ja: ピーナッツは最も重篤なアレルギー反応を引き起こす食品の一つです。
        riskLevel:
          type: string
          enum: [safe, caution, danger]
          example: danger
        sources:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                example: FDA - Major Food Allergens
              url:
                type: string
                format: uri
                example: https://www.fda.gov/food/food-allergens

    IngredientSummary:
      type: object
      description: |
        목록 표시용 성분 요약 (description, sources 미포함).

        `translations` 는 다국어 성분명 (en/ko/ja/zh/es/fr). 전환기에는 name/nameKo와 공존하며,
        FE는 `translations[userLang] ?? name` 순으로 우선한다
        (docs/ocr-pipeline-rebuild-guide.md §10.2).
      properties:
        id:
          type: string
          example: ing-peanut
        name:
          type: string
          example: Peanuts
        nameKo:
          type: string
          example: 땅콩
        confidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: |
            OCR 인식 신뢰도. 바코드 경로에서는 생략.
            0이면 판독 실패 ([illegible] 표시). 0.85 미만은 클라이언트에서 저신뢰 경고.
        translations:
          type: object
          description: |
            BCP-47 로케일 → 성분명 매핑. OCR 경로에서는 6개 기본 로케일(en/ko/ja/zh/es/fr)이
            항상 채워진다. 바코드/may-* 경로는 생략 가능(optional).
          additionalProperties:
            type: string
          example:
            en: Peanuts
            ko: 땅콩
            ja: ピーナッツ
            zh: 花生
            es: Cacahuetes
            fr: Arachides

    OCRResult:
      type: object
      description: |
        POST /ocr의 JSON 응답 또는 SSE `cached` 이벤트 data.
      properties:
        extractedText:
          type: string
          description: 이미지에서 추출한 원문 텍스트
          example: 'Ingredients: Peanuts, Sugar, Palm Oil, Salt'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientSummary'
        overallConfidence:
          type: number
          minimum: 0
          maximum: 1
          description: |
            OCR 추출의 전체 신뢰도. 0.85 미만이면 클라이언트에서 경고 배너.
          example: 0.92
        illegibleRegions:
          type: integer
          minimum: 0
          description: 판독 불가 영역 수. > 0이면 일부 성분 누락 가능성.
          example: 0
        detectedLanguages:
          type: array
          items:
            type: string
          description: 감지된 언어 목록 (BCP-47)
          example: [en]
        productId:
          type: string
          description: |
            product-upsert 파이프라인이 반환한 제품 ID.
            즐겨찾기·이력 저장 시 이 ID 사용.
          example: prod-abc
        ladderStage:
          type: integer
          minimum: 1
          maximum: 5
          description: 실제 추출에 도달한 폴백 사다리 단계 (관측성용)
          example: 1
        scanLogId:
          type: string
          description: scan_logs 테이블에 기록된 이 스캔의 로그 ID. 교정 제출 시 사용.
          example: log-001
        cacheHit:
          type: string
          enum: [none, 'phash-local', 'phash-server', barcode]

    OCRDoneMeta:
      type: object
      description: SSE `done` 이벤트의 data. OCRResult에서 ingredients/extractedText를 뺀 메타 정보.
      properties:
        overallConfidence:
          type: number
        illegibleRegions:
          type: integer
        detectedLanguages:
          type: array
          items:
            type: string
        productId:
          type: string
        ladderStage:
          type: integer
        scanLogId:
          type: string

    AnalysisResult:
      type: object
      properties:
        verdict:
          type: string
          enum: [safe, caution, danger]
          description: |
            safe    : 모든 성분 이상 없음
            caution : 주의 성분 포함 (strict 모드에서 may contain 경고)
            danger  : 알러지 유발 성분 직접 포함
          example: danger
        isSafe:
          type: boolean
          example: false
        triggeredBy:
          type: array
          description: 위험 또는 주의 판정을 유발한 성분 목록
          items:
            type: object
            properties:
              id:
                type: string
                example: ing-peanut
              name:
                type: string
                example: Peanuts
              nameKo:
                type: string
                example: 땅콩
              reason:
                type: string
                example: 알러지 프로필에 등록된 성분입니다.
              riskLevel:
                type: string
                enum: [caution, danger]
                example: danger
        safeIngredients:
          type: array
          description: 문제없는 성분 목록
          items:
            $ref: '#/components/schemas/IngredientSummary'
        dataCompleteness:
          type: string
          enum: [complete, partial]
          description: |
            complete : productId가 서버 DB에 존재 (OCR 업서트 후 포함) — 서버사이드 성분 권위
            partial  : 서버 DB 미등록 제품 또는 OFF 폴백 — 결과 신뢰도 낮음

    ScanHistoryItem:
      type: object
      properties:
        id:
          type: string
          example: hist-001
        productId:
          type: string
          example: prod-001
        product:
          $ref: '#/components/schemas/ProductSummary'
        result:
          type: string
          enum: [safe, caution, danger]
          example: danger
        scannedAt:
          type: string
          format: date-time
          example: '2026-04-08T10:30:00Z'
        scanLogId:
          type: string
          nullable: true

    FavoriteItem:
      type: object
      properties:
        id:
          type: string
          example: fav-001
        productId:
          type: string
          example: prod-001
        product:
          $ref: '#/components/schemas/ProductSummary'
        addedAt:
          type: string
          format: date-time
          example: '2026-04-08T10:35:00Z'

    SearchResultItem:
      type: object
      description: |
        GET /search/products items[]. 개인화된 riskLevel · isSafe 포함.
      properties:
        id:
          type: string
          example: prod-001
        name:
          type: string
          example: Reese's Peanut Butter Cups
        brand:
          type: string
          example: Hershey's
        image:
          type: string
          format: uri
          nullable: true
        category:
          type: string
          nullable: true
          description: BE 내부 카테고리 식별자 (beverages / snacks / bakery / dairy / cereals / cookies / chocolates / spreads / meat / seafood / condiments)
          example: snacks
        riskLevel:
          type: string
          enum: [safe, caution, danger]
          description: 현재 사용자 프로필 기준 위험도
          example: danger
        isSafe:
          type: boolean
          description: 현재 사용자 프로필 기준 안전 여부
          example: false

    SearchSuggestion:
      type: object
      description: GET /search/suggestions suggestions[]. 개인화되지 않은 범용 prefix 매칭 결과.
      properties:
        name:
          type: string
          example: Sprite
        highlight:
          type: array
          description: 매칭 구간 인덱스 정보 (자동완성 UI 강조용). [시작, 끝] 쌍의 배열.
          items:
            type: array
            items:
              type: integer
            minItems: 2
            maxItems: 2
          example: [[0, 3]]

    Correction:
      type: object
      properties:
        id:
          type: string
          example: corr-001
        scanLogId:
          type: string
          example: log-001
        corrections:
          type: array
          items:
            type: object
            properties:
              ingredientId:
                type: string
                nullable: true
              originalName:
                type: string
              correctedName:
                type: string
        createdAt:
          type: string
          format: date-time

    ReviewQueueItem:
      type: object
      properties:
        id:
          type: string
          example: rev-001
        phash:
          type: string
          example: 'c3f1a0b8d4e60927'
        imageRef:
          type: string
          nullable: true
          description: 사용자가 동의한 경우에만 존재 (Supabase Storage 경로)
        lastExtraction:
          $ref: '#/components/schemas/OCRResult'
        reason:
          type: string
          enum: [low_confidence, parse_error, timeout, user_reported]
        createdAt:
          type: string
          format: date-time

    MemberProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        profileImage:
          type: string
          nullable: true
        allergyProfile:
          type: array
          items:
            type: string
        dietaryRestrictions:
          type: array
          items:
            type: string
        sensitivityLevel:
          type: string
          enum: [strict, normal]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MemberProfileInput:
      type: object
      required: [name, allergyProfile, dietaryRestrictions, sensitivityLevel]
      properties:
        name:
          type: string
        profileImage:
          type: string
          nullable: true
        allergyProfile:
          type: array
          items:
            type: string
        dietaryRestrictions:
          type: array
          items:
            type: string
        sensitivityLevel:
          type: string
          enum: [strict, normal]

    MemberProfileUpdate:
      type: object
      properties:
        name:
          type: string
        profileImage:
          type: string
          nullable: true
        allergyProfile:
          type: array
          items:
            type: string
        dietaryRestrictions:
          type: array
          items:
            type: string
        sensitivityLevel:
          type: string
          enum: [strict, normal]

    HealthReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
        reportDate:
          type: string
          format: date
          nullable: true
        fileMime:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        fileSizeBytes:
          type: integer
        extractedAllergenIds:
          type: array
          items:
            type: string
        notes:
          type: string
        uploadedAt:
          type: string
          format: date-time

    HealthReportDownload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        downloadUrl:
          type: string
          description: Supabase Storage signed URL (TTL 5분)
        expiresAt:
          type: string
          format: date-time

    # ── 커뮤니티 (리뷰 / 좋아요 / Q&A) ──────────────────────────────────

    Review:
      type: object
      required: [id, productId, userId, rating, content, isMine, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, example: prod-001 }
        userId: { type: string, format: uuid }
        userNickname:
          type: string
          description: 작성자 표시명. BE 가 profiles.display_name(커뮤니티 전용 표시명) 조인. 미설정/NULL 시 '익명'.
          example: Jasmin
        rating: { type: integer, minimum: 1, maximum: 5, example: 4 }
        content:
          type: string
          maxLength: 500
          example: "Those with a flour allergy, please exercise caution."
        isMine:
          type: boolean
          description: row.user_id === request.userId. 인증 필수라 항상 정확.
          example: false
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LikeState:
      type: object
      required: [productId, likeCount, isLiked]
      properties:
        productId: { type: string, example: prod-001 }
        likeCount:
          type: integer
          description: products.like_count(트리거 비정규화 값) 조회
          example: 129
        isLiked: { type: boolean }

    QnaPostSummary:
      type: object
      required: [id, userId, title, content, answerCount, isResolved, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        userNickname:
          type: string
          description: 작성자 표시명. BE 가 profiles.display_name(커뮤니티 전용 표시명) 조인. 미설정/NULL 시 '익명'.
          example: 알레르기맘
        title: { type: string, maxLength: 100 }
        content: { type: string, maxLength: 2000 }
        answerCount:
          type: integer
          description: qna_posts.answer_count(트리거 비정규화 값) 조회
          example: 3
        isResolved: { type: boolean, example: false }
        relatedProductId:
          type: string
          nullable: true
          example: prod-001
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    QnaAnswer:
      type: object
      required: [id, qnaId, userId, content, isAccepted, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        qnaId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        userNickname:
          type: string
          description: 작성자 표시명. BE 가 profiles.display_name(커뮤니티 전용 표시명) 조인. 미설정/NULL 시 '익명'.
          example: 영양사친구
        content: { type: string, maxLength: 1000 }
        isAccepted:
          type: boolean
          description: 질문 작성자 채택 여부. v1 은 항상 false (채택 기능 미구현, 컬럼·필드만 예약).
          example: false
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    QnaPostDetail:
      allOf:
        - $ref: '#/components/schemas/QnaPostSummary'
        - type: object
          required: [answers]
          properties:
            relatedProduct:
              type: object
              nullable: true
              description: related_product_id 가 있을 때만 products 조인 결과
              properties:
                productId: { type: string, example: prod-001 }
                name: { type: string }
                image: { type: string, nullable: true }
            answers:
              type: array
              items: { $ref: '#/components/schemas/QnaAnswer' }

    CommunityFeedItem:
      type: object
      required: [productId, name, isSafe, riskLevel, likeCount]
      properties:
        productId: { type: string, example: prod-001 }
        name: { type: string, example: 오리온 초코파이 }
        brand: { type: string, nullable: true, example: 오리온 }
        image: { type: string, nullable: true }
        isSafe:
          type: boolean
          description: 현재 활성 프로필 기준 (computeVerdict 서버 산출)
        riskLevel:
          type: string
          enum: [safe, caution, danger]
        likeCount: { type: integer, example: 128 }
        scanCount:
          type: integer
          nullable: true
          description: weeklyTrending 만 채움 (최근 7일 scan_history 집계). similarUsersPicks 는 null.

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: |
            에러 코드 (클라이언트 분기 처리용).
            표준 코드: INVALID_INPUT · INVALID_QUERY · TOO_MANY_REQUESTS ·
                      UNAUTHORIZED · FORBIDDEN · PRODUCT_NOT_FOUND ·
                      OCR_FAILED · OCR_UNREADABLE · IMAGE_TOO_LARGE · INVALID_FILE_TYPE ·
                      INGREDIENT_NOT_FOUND · ALREADY_FAVORITED · FAVORITE_NOT_FOUND ·
                      CORRECTION_CONSENT_REQUIRED · PROFILE_NOT_FOUND · FORBIDDEN_PROFILE ·
                      NOT_FOUND · STORAGE_UNAVAILABLE · DB_UNAVAILABLE · SERVER_ERROR ·
                      HISTORY_NOT_FOUND · REVIEW_NOT_FOUND · FORBIDDEN_REVIEW · ALREADY_REVIEWED ·
                      ALREADY_LIKED · LIKE_NOT_FOUND · QNA_NOT_FOUND · FORBIDDEN_QNA ·
                      ANSWER_NOT_FOUND · FORBIDDEN_ANSWER · SERVICE_DISABLED
          example: INVALID_INPUT
        message:
          type: string
          description: 사람이 읽을 수 있는 에러 메시지
          example: 요청 데이터가 올바르지 않습니다.

    ErrorEvent:
      type: object
      description: SSE `error` 이벤트의 data.
      properties:
        error:
          type: string
          example: OCR_UNREADABLE
        message:
          type: string
        retryable:
          type: boolean
          description: true면 같은 이미지로 재시도 가능, false면 재촬영 필요
          example: false
        ladderStage:
          type: integer

    # ── Closed beta dashboard (GET /admin/beta-metrics) ─────────────────────

    BetaCohort:
      type: string
      enum: [us-allergy, us-ka, us-veg]

    BetaMetrics:
      type: object
      required:
        - generatedAt
        - cacheTtlSeconds
        - thresholds
        - activation
        - retention
        - multiProfile
        - koreanShare
        - feedback
        - costGuard
        - scansTimeseries
        - caveats
      properties:
        generatedAt:     { type: string, format: date-time }
        cacheTtlSeconds: { type: integer, example: 60 }
        thresholds:      { $ref: '#/components/schemas/BetaThresholds' }
        activation:      { $ref: '#/components/schemas/BetaMetricByCohort' }
        retention:       { $ref: '#/components/schemas/BetaMetricByCohort' }
        multiProfile:    { $ref: '#/components/schemas/BetaMultiProfile' }
        koreanShare:     { $ref: '#/components/schemas/BetaKoreanShare' }
        feedback:        { $ref: '#/components/schemas/BetaMetricByCohort' }
        costGuard:       { $ref: '#/components/schemas/BetaMetricByCohort' }
        scansTimeseries: { $ref: '#/components/schemas/BetaScansTimeseries' }
        caveats:
          type: array
          items: { type: string }
          example:
            - "Cost/Stage4 metrics double-count users with multi-cohort beta_cohort."

    BetaThresholds:
      type: object
      description: observability.md §베타 메트릭 표 와 1:1.
      properties:
        activationPct:   { type: object, additionalProperties: { type: number } }
        d3RetentionPct:  { type: object, additionalProperties: { type: number } }
        thumbsUpPct:     { type: number, example: 60 }
        correctionPct:   { type: object, additionalProperties: { type: number } }
        costPerScanUsd:  { type: object, additionalProperties: { type: number } }
        stage4Pct:       { type: object, additionalProperties: { type: number } }
        multiProfilePct: { type: number, example: 30 }
        koreanSharePct:  { type: number, example: 30 }

    BetaCohortRow:
      type: object
      description: |
        코호트별 단일 row. 메트릭마다 채워지는 키 집합이 다르며 (activation 은 funnel
        키, retention 은 d3* 키 등) 미해당 키는 응답에서 생략될 수 있다.
        `pass` 는 BE 가 임계값과 비교해 채운 결과 (null=N/A).
      properties:
        cohort: { $ref: '#/components/schemas/BetaCohort' }
        # activation
        waitlistSignups:    { type: integer, nullable: true }
        signedUp:           { type: integer, nullable: true }
        scannedAtLeastOnce: { type: integer, nullable: true }
        activationPct:      { type: number,  nullable: true }
        # retention
        cohortSize:         { type: integer, nullable: true }
        d3Retained:         { type: integer, nullable: true }
        d3Pct:              { type: number,  nullable: true }
        # feedback
        thumbsUp:           { type: integer, nullable: true }
        thumbsDown:         { type: integer, nullable: true }
        feedbackTotal:      { type: integer, nullable: true }
        positivePct:        { type: number,  nullable: true }
        correctionsCount:   { type: integer, nullable: true }
        correctionPct:      { type: number,  nullable: true }
        # cost guard
        scans:              { type: integer, nullable: true }
        costUsd:            { type: number,  nullable: true }
        avgCostUsd:         { type: number,  nullable: true }
        stage4Count:        { type: integer, nullable: true }
        stage4Pct:          { type: number,  nullable: true }
        # 임계 통과 여부
        pass:               { type: boolean, nullable: true }

    BetaMetricByCohort:
      type: object
      required: [error, rows]
      properties:
        error: { type: string, nullable: true, description: '부분 실패 시 메시지, 정상 null' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/BetaCohortRow' }

    BetaMultiProfile:
      type: object
      required: [error]
      description: us-allergy 코호트 한정 메트릭.
      properties:
        error:                  { type: string,  nullable: true }
        cohortSize:             { type: integer, nullable: true }
        usersWithMemberProfile: { type: integer, nullable: true }
        multiProfilePct:        { type: number,  nullable: true }
        pass:                   { type: boolean, nullable: true }

    BetaKoreanShare:
      type: object
      required: [error]
      description: us-ka 코호트 한정 메트릭.
      properties:
        error:       { type: string,  nullable: true }
        totalScans:  { type: integer, nullable: true }
        koreanScans: { type: integer, nullable: true }
        koreanPct:   { type: number,  nullable: true }
        pass:        { type: boolean, nullable: true }

    BetaScansTimeseries:
      type: object
      required: [error, points, windowDays]
      properties:
        error:      { type: string, nullable: true }
        windowDays: { type: integer, example: 14 }
        points:
          type: array
          items:
            type: object
            properties:
              day:        { type: string, format: date }
              cohort:     { $ref: '#/components/schemas/BetaCohort' }
              scans:      { type: integer }
              costUsd:    { type: number }
              thumbsUp:   { type: integer }
              thumbsDown: { type: integer }

  responses:

    Unauthorized:
      description: 토큰 없음 또는 만료
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: UNAUTHORIZED
            message: 인증이 필요합니다. 다시 로그인해 주세요.

    InvalidInput:
      description: 요청 데이터 유효성 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: INVALID_INPUT
            message: 요청 데이터가 올바르지 않습니다.

    TooManyRequests:
      description: Rate limit 초과 (Retry-After 헤더 포함)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: TOO_MANY_REQUESTS
            message: 요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.

    ServiceUnavailable:
      description: |
        DB_UNAVAILABLE | SERVICE_DISABLED.
        DB_UNAVAILABLE: DB(Supabase) 일시 장애 또는 환경변수 미설정. getSupabase() throw 시
        모든 엔드포인트가 동일하게 반환 (verifyToken 포함). 클라이언트는 재시도 가능.
        SERVICE_DISABLED: 커뮤니티 킬스위치(COMMUNITY_ENABLED=false) 활성화 상태.
        운영자가 DB 장애(DB_UNAVAILABLE)와 의도적 비활성(SERVICE_DISABLED)을 구분할 수 있도록
        별도 코드 채택.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: DB_UNAVAILABLE
            message: 서비스를 일시적으로 사용할 수 없습니다.
